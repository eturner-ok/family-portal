<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #C6DAE6;
    --sky-bottom: #EEF3F5;
    --ink: #142230;
    --muted: #536676;
    --faint: rgba(20, 34, 48, .13);
    --alert: #B3261E;
    --sans: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  :root[data-phase="dusk"] { --sky-top: #C9C3D9; --sky-bottom: #EFECF2; }
  :root[data-phase="night"] { --sky-top: #0D1727; --sky-bottom: #1A2638; --ink: #E2E8EF; --muted: #8B9AAD; --faint: rgba(226, 232, 239, .14); }

  /* Fall background for the Thanksgiving season; Christmas keeps the light winter sky */
  :root[data-season="thanksgiving"] { --sky-top: #EDCDA6; --sky-bottom: #F8EDE0; --muted: #6E5D50; --faint: rgba(70, 40, 20, .14); }
  :root[data-season="thanksgiving"][data-phase="dusk"] { --sky-top: #E2BBA0; --sky-bottom: #F4E6DB; }
  :root[data-season="thanksgiving"][data-phase="night"] { --sky-top: #1D1512; --sky-bottom: #2D211B; --ink: #EFE6DC; --muted: #AD9C8E; --faint: rgba(239, 230, 220, .14); }

  html, body { height: 100%; margin: 0; }
  html { background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 75%) fixed; background-color: var(--sky-top); }
  body {
    color: var(--ink);
    font-family: var(--sans);
    font-size: clamp(13px, 1.55vw, 22px);
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .wrap {
    box-sizing: border-box;
    height: 100%;
    padding: max(2.4vw, env(safe-area-inset-top)) 3.2vw max(2vw, env(safe-area-inset-bottom));
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 2.4vw;
  }

  /* Top: clock and current weather */
  .top { display: flex; flex-direction: column; gap: 1em; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 2em; }
  .clock { font-size: 5.4em; font-weight: 300; letter-spacing: -.035em; line-height: .88; font-variant-numeric: tabular-nums; }
  .clock small { font-size: .3em; font-weight: 500; letter-spacing: 0; margin-left: .25em; color: var(--muted); }
  .date { font-size: 1.45em; font-weight: 500; margin-top: .35em; }
  .now { display: flex; align-items: center; gap: .55em; }
  .now .icon { font-size: 3.4em; line-height: 1; }
  .now .temp { font-size: 4.6em; font-weight: 300; line-height: .88; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .now .desc { font-size: 1.15em; font-weight: 600; }
  .now .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
  .alert { display: none; background: var(--alert); color: #fff; padding: .55em .9em; border-radius: .45em; font-weight: 600; font-size: 1.1em; }
  .alert.show { display: block; }

  /* Middle: today + coming up */
  main { display: grid; grid-template-columns: 1.12fr 1fr; gap: 4vw; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; }
  h2 { font-size: 1.55em; font-weight: 650; letter-spacing: -.01em; margin: 0 0 .45em; }
  ul { list-style: none; margin: 0; padding: 0; }
  .ev { display: grid; grid-template-columns: 5.4em 1fr; gap: .7em; align-items: baseline; padding: .32em 0; }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .88em; white-space: nowrap; }
  .ev .name { position: relative; padding-left: .7em; }
  .ev .name::before { content: ""; position: absolute; left: 0; top: .12em; bottom: .12em; width: .24em; border-radius: .2em; background: var(--bar); }
  .ev .where { display: block; color: var(--muted); font-size: .7em; margin-top: .1em; }
  .today-list { flex: 1 1 0; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); }
  .today-list .ev { font-size: 1.4em; padding: .4em 0; }
  .empty { color: var(--muted); padding: .3em 0; }
  .today-list .empty { font-size: 1.25em; }

  .faith { display: flex; align-items: center; gap: 1.4em; border-top: 1px solid var(--faint); padding-top: .9em; margin-top: .6em; }
  .verse { flex: 1; min-width: 0; }

  /* Advent wreath */
  .advent { display: none; flex: 0 0 auto; width: 7.6em; text-align: center; }
  .advent.show { display: block; }
  .faith:has(.advent.show) .verse p { -webkit-line-clamp: 5; font-size: 1.2em; }
  .advent svg { display: block; width: 100%; height: auto; overflow: visible; }
  .advent .cap { color: var(--muted); font-size: .74em; line-height: 1.25; margin-top: .15em; }
  .advent .cap b { display: block; color: var(--ink); font-size: 1.15em; font-weight: 650; }
  .advent .num { font-family: var(--sans); font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .advent .unit { font-family: var(--sans); font-weight: 500; fill: var(--muted); }
  .advent .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.9s ease-in-out infinite alternate; }
  .advent .glow { animation: glow 1.9s ease-in-out infinite alternate; }
  @keyframes flicker { 0% { transform: scale(1, 1) skewX(0deg); } 40% { transform: scale(.93, 1.07) skewX(2deg); } 100% { transform: scale(1.04, .95) skewX(-2deg); } }
  @keyframes glow { from { opacity: .45; } to { opacity: .8; } }
  .verse p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.3em; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .verse cite { display: block; font-style: normal; font-weight: 600; color: var(--muted); margin-top: .4em; font-size: .9em; }

  .days { flex: 1 1 0; min-height: 0; overflow: hidden; }
  .day { display: grid; grid-template-columns: 4.2em 1fr; gap: .7em; padding: .38em 0; border-top: 1px solid var(--faint); }
  .day:first-child { border-top: 0; padding-top: 0; }
  .day .lab { line-height: 1.25; white-space: nowrap; }
  .day .lab span { display: inline; color: var(--muted); font-size: .85em; margin-right: .3em; }
  .day .lab b { font-size: 1.2em; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .day .ev { grid-template-columns: 4.8em 1fr; padding: .12em 0; }
  .day .empty, .day .more { color: var(--muted); font-size: .9em; padding: .12em 0; }

  /* Bottom: forecast + legend */
  footer { display: grid; grid-template-columns: 1fr auto; gap: 3vw; align-items: center; border-top: 1px solid var(--faint); padding-top: 1em; }
  .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1em; }
  .fc { display: flex; align-items: center; gap: .5em; }
  .fc .ic { font-size: 1.9em; line-height: 1; }
  .fc .dn { font-weight: 600; }
  .fc .hl { font-variant-numeric: tabular-nums; }
  .fc .lo, .fc .rain { color: var(--muted); }
  .fc .rain { font-size: .8em; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .35em; }
  .legend { display: flex; gap: 1em; flex-wrap: wrap; justify-content: flex-end; color: var(--muted); font-size: .85em; }
  .legend button { font: inherit; color: inherit; background: none; border: 0; padding: .45em .55em; margin: -.45em -.3em; border-radius: .4em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .legend i { display: inline-block; width: .62em; height: .62em; border-radius: 50%; background: var(--c); margin-right: .35em; }
  .legend .off { opacity: .45; text-decoration: line-through; }
  .legend .off i { background: transparent; box-shadow: inset 0 0 0 .12em var(--c); }
  .status { color: var(--muted); font-size: .75em; }
  .status.warn { color: var(--alert); font-weight: 600; }
  :root[data-phase="night"] .status.warn { color: #F2A29C; }


  /* Seasonal themes: Thanksgiving turkeys and leaves, Christmas penguins and snow */
  #rink { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .skater { position: absolute; left: 0; bottom: .2vw; width: 7.5vw; color: var(--ink); opacity: .85; animation: glide linear forwards; will-change: transform; }
  .skater.left { animation-name: glide-left; }
  .skater svg { display: block; width: 100%; height: auto; overflow: visible; }
  .skater .bob { animation: bob 1.7s ease-in-out infinite; }
  .skater .leg { transform-box: view-box; transform-origin: 30px 47px; animation: stride 1.7s ease-in-out infinite; }
  .skater .leg.b { animation-delay: -.85s; }
  .skater .scarf { transform-box: view-box; transform-origin: 37px 25px; animation: flutter .45s ease-in-out infinite alternate; }
  @keyframes glide { from { transform: translateX(-12vw); } to { transform: translateX(112vw); } }
  @keyframes glide-left { from { transform: translateX(112vw) scaleX(-1); } to { transform: translateX(-12vw) scaleX(-1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  @keyframes stride { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(20deg); } }
  @keyframes flutter { from { transform: rotate(-3deg); } to { transform: rotate(5deg) scaleY(.85); } }
  .flake { position: absolute; top: -2vw; border-radius: 50%; background: rgba(255, 255, 255, .92); box-shadow: 0 0 2px rgba(20, 34, 48, .25); animation: fall linear infinite; }
  @keyframes fall { 0% { transform: translate(0, 0); } 50% { transform: translate(1.5vw, 52vh); } 100% { transform: translate(-1vw, 106vh); } }

  /* Penguins (Christmas season) */
  :root { --pg-top: #3B4C63; --pg-bottom: #16202D; }
  :root[data-phase="night"] { --pg-top: #4A5E7A; --pg-bottom: #1F2B3B; }
  .penguin { opacity: 1; }
  .penguin .pg-shadow { fill: rgba(20, 34, 48, .16); }
  :root[data-phase="night"] .penguin .pg-shadow { fill: rgba(226, 232, 239, .10); }
  :root[data-phase="night"] .penguin .pg-body, :root[data-phase="night"] .penguin .pg-fl { stroke: rgba(226, 232, 239, .5); stroke-width: 1; }
  .penguin .pg-blade { stroke: #B8C4CF; stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .penguin .pg-post { stroke: #8C99A6; stroke-width: 1.6; }
  .penguin .pg-lean { transform-box: view-box; transform-origin: 50px 104px; animation: pg-sway 1.7s ease-in-out infinite; }
  .penguin .pg-leg { transform-box: view-box; transform-origin: 50px 92px; animation: pg-push 1.7s ease-in-out infinite; }
  .penguin .pg-leg.b { animation-delay: -.85s; }
  .penguin.chick .pg-lean, .penguin.chick .pg-leg { animation-duration: 1.1s; }
  .penguin.chick .pg-leg.b { animation-delay: -.55s; }
  .penguin .pg-flipper { transform-box: view-box; transform-origin: 44px 54px; animation: pg-flap .9s ease-in-out infinite alternate; }
  .penguin .pg-scarf { transform-box: view-box; transform-origin: 44px 48px; animation: pg-flutter .4s ease-in-out infinite alternate; }
  .penguin svg { transform-origin: 50% 95%; }
  @keyframes pg-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
  @keyframes pg-push { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-7px, -2px) rotate(-7deg); } }
  @keyframes pg-flap { from { transform: rotate(-6deg); } to { transform: rotate(9deg); } }
  @keyframes pg-flutter { from { transform: rotate(-4deg) scaleY(1); } to { transform: rotate(5deg) scaleY(.82); } }
  @keyframes pg-wobble { 0%, 44% { transform: rotate(0); } 47% { transform: rotate(-11deg); } 50% { transform: rotate(9deg); } 53% { transform: rotate(-6deg); } 56% { transform: rotate(3deg); } 59%, 100% { transform: rotate(0); } }
  :root { --tk-top: #8A5631; --tk-bottom: #3F2516; --tk-wing1: #9A653C; --tk-wing2: #5E3920; --tk-f1: #4A2C18; --tk-f2: #7A4B2A; --tk-skin: #C7D2DD;
          --wr-1a: #4F8A57; --wr-1b: #2C5A35; --wr-2a: #3F7A4C; --wr-2b: #22492C; --wr-3a: #5E9A62; --wr-3b: #36663E; --wr-3: #1E3E26;
          --wr-p1: #9C7BD0; --wr-p2: #6A45A0; --wr-p3: #4B2E78; }
  :root[data-phase="night"] { --tk-top: #B98455; --tk-bottom: #6E4628; --tk-wing1: #C99567; --tk-wing2: #8A5A35; --tk-f1: #6A4428; --tk-f2: #9A6A42; --tk-skin: #D9E2EA;
          --wr-1a: #6FAE77; --wr-1b: #437A4D; --wr-2a: #5E9C6A; --wr-2b: #386B45; --wr-3a: #7DBA80; --wr-3b: #4F8758; --wr-3: #2C5636;
          --wr-p1: #B9A0E2; --wr-p2: #8E68C6; --wr-p3: #6A4AA0; }
  .turkey { opacity: 1; }
  .turkey .tk-shadow { fill: rgba(40, 20, 10, .16); }
  :root[data-phase="night"] .turkey .tk-shadow { fill: rgba(255, 240, 225, .08); }
  :root[data-phase="night"] .turkey .tk-body { stroke: rgba(255, 240, 225, .45); stroke-width: 1; }
  .turkey .tk-shin { stroke: #D9A441; stroke-width: 3; stroke-linecap: round; }
  .turkey .tk-toe { stroke: #D9A441; stroke-width: 2; stroke-linecap: round; }
  .turkey .tk-leg { transform-box: view-box; animation: tk-step .9s ease-in-out infinite; }
  .turkey .tk-leg.a { transform-origin: 50px 84px; }
  .turkey .tk-leg.b { transform-origin: 60px 84px; animation-delay: -.45s; }
  .turkey .tk-bob { animation: tk-bob .45s ease-in-out infinite; }
  .turkey .tk-head { transform-box: view-box; transform-origin: 70px 66px; animation: tk-thrust .9s ease-in-out infinite; }
  .turkey .tk-tail { transform-box: view-box; transform-origin: 44px 66px; animation: tk-tail 1.8s ease-in-out infinite; }
  .turkey svg { transform-origin: 40% 90%; }
  @keyframes tk-step { 0%, 100% { transform: rotate(-17deg); } 50% { transform: rotate(17deg); } }
  @keyframes tk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
  @keyframes tk-thrust { 0%, 100% { transform: translateX(0) rotate(0); } 30% { transform: translateX(3.5px) rotate(4deg); } 60% { transform: translateX(-1px) rotate(-2deg); } }
  @keyframes tk-tail { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes tk-display { 0%, 42% { transform: scale(1); } 46%, 54% { transform: scale(1.14) translateY(-2px); } 58%, 100% { transform: scale(1); } }
  .leaf { position: absolute; top: -3vw; animation: leaf-fall linear infinite; }
  .leaf svg { display: block; width: 100%; height: auto; animation: spin linear infinite; }
  @keyframes leaf-fall { 0% { transform: translate(0, 0); } 33% { transform: translate(3vw, 36vh); } 66% { transform: translate(-2.5vw, 72vh); } 100% { transform: translate(1vw, 108vh); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #rink { display: none; } }

  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .forecast { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="pgBody" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" style="stop-color:var(--pg-top)"/><stop offset="1" style="stop-color:var(--pg-bottom)"/></linearGradient>
  <radialGradient id="pgBelly" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4EC"/></radialGradient>
  <linearGradient id="pgBeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC15A"/><stop offset="1" stop-color="#E8892A"/></linearGradient>
  <linearGradient id="pgFoot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB24D"/><stop offset="1" stop-color="#E07C22"/></linearGradient>
  <radialGradient id="pgChick" cx=".45" cy=".35" r=".8"><stop offset="0" stop-color="#C9D1D9"/><stop offset="1" stop-color="#8F9BA8"/></radialGradient>

  <linearGradient id="tkFeather" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--tk-f1)"/><stop offset="1" style="stop-color:var(--tk-f2)"/></linearGradient>
  <linearGradient id="tkBody" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" style="stop-color:var(--tk-top)"/><stop offset="1" style="stop-color:var(--tk-bottom)"/></linearGradient>
  <linearGradient id="tkWing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tk-wing1)"/><stop offset="1" style="stop-color:var(--tk-wing2)"/></linearGradient>
  <linearGradient id="tkBeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC970"/><stop offset="1" stop-color="#D98A2A"/></linearGradient>
  <linearGradient id="wrLeaf1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wr-1a)"/><stop offset="1" style="stop-color:var(--wr-1b)"/></linearGradient>
  <linearGradient id="wrLeaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wr-2a)"/><stop offset="1" style="stop-color:var(--wr-2b)"/></linearGradient>
  <linearGradient id="wrLeaf3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wr-3a)"/><stop offset="1" style="stop-color:var(--wr-3b)"/></linearGradient>
  <radialGradient id="wrCone" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#9A6A42"/><stop offset="1" stop-color="#5A3A22"/></radialGradient>
  <linearGradient id="wrRibbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0483C"/><stop offset="1" stop-color="#A82A22"/></linearGradient>
  <linearGradient id="wrPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--wr-p1)"/><stop offset=".55" style="stop-color:var(--wr-p2)"/><stop offset="1" style="stop-color:var(--wr-p3)"/></linearGradient>
  <linearGradient id="wrRose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2A9CB"/><stop offset=".55" stop-color="#D86FA3"/><stop offset="1" stop-color="#B0507F"/></linearGradient>
  <linearGradient id="wrWhite" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F3EEE4"/><stop offset="1" stop-color="#D9D1C2"/></linearGradient>
  <linearGradient id="wrFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A2E"/><stop offset=".55" stop-color="#FFC94A"/><stop offset="1" stop-color="#FFE9A0"/></linearGradient>
  <radialGradient id="wrGlow"><stop offset="0" stop-color="#FFD36B" stop-opacity=".9"/><stop offset="1" stop-color="#FFD36B" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="rink"></div>
<div class="wrap">
  <div class="top">
    <header>
      <div>
        <div class="clock" id="clock"></div>
        <div class="date" id="date"></div>
      </div>
      <div class="now" id="now"></div>
    </header>
    <div class="alert" id="alert"></div>
  </div>

  <main>
    <section>
      <h2>Today</h2>
      <ul class="today-list" id="today"></ul>
      <div class="faith">
        <div class="advent" id="advent"></div>
        <div class="verse" id="verse"></div>
      </div>
    </section>
    <section>
      <h2>Coming up</h2>
      <div class="days" id="days"></div>
    </section>
  </main>

  <footer>
    <div class="forecast" id="forecast"></div>
    <div class="side">
      <div class="legend" id="legend"></div>
      <div class="status" id="status"></div>
    </div>
  </footer>
</div>

<script>
  // ---------- SETTINGS ----------
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbIfUR039krPjlgW-TGfQ5ne9a4GGb1ZOm4t7XvpUcs9wkgOE-rtM5i4tQcW5tXRgNkQ/exec'; // ends in /exec
  const TZ = 'America/Chicago';
  const REFRESH_MINUTES = 10;
  // ------------------------------

  const $ = id => document.getElementById(id);
  let data = null, lastOk = 0, lastError = '', shownDay = '';

  function getKey() {
    const fromLink = new URLSearchParams(location.hash.slice(1)).get('k');
    if (fromLink) { try { localStorage.setItem('portalKey', fromLink); } catch (e) {} return fromLink; }
    try { const saved = localStorage.getItem('portalKey'); if (saved) return saved; } catch (e) {}
    const typed = prompt('Enter the family portal key');
    if (typed) { try { localStorage.setItem('portalKey', typed); } catch (e) {} }
    return typed || '';
  }
  const KEY = getKey();

  // People hidden on this iPad (tap a name in the legend to hide or show)
  let hidden = [];
  try { hidden = JSON.parse(localStorage.getItem('portalHidden') || '[]'); } catch (e) {}

    render();
  }
  // Drops events that belong only to hidden people; shared events keep the visible people's colors
  function visible(events) {
    return events.map(e => {
      const keep = e.who.map((w, i) => i).filter(i => !hidden.includes(e.who[i]));
      return keep.length ? Object.assign({}, e, { who: keep.map(i => e.who[i]), colors: keep.map(i => e.colors[i]) }) : null;
    }).filter(Boolean);
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const todayIso = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const shortTime = t => String(t).replace(':00 ', ' ');

  function wx(code, isDay) {
    const c = Number(code);
    if (c === 0) return [isDay === false ? '🌙' : '☀️', 'Clear'];
    if (c === 1) return [isDay === false ? '🌙' : '🌤️', 'Mostly clear'];
    if (c === 2) return ['⛅', 'Partly cloudy'];
    if (c === 3) return ['☁️', 'Cloudy'];
    if (c === 45 || c === 48) return ['🌫️', 'Fog'];
    if (c >= 51 && c <= 55) return ['🌦️', 'Drizzle'];
    if (c === 56 || c === 57 || c === 66 || c === 67) return ['🧊', 'Freezing rain'];
    if (c >= 61 && c <= 65) return ['🌧️', 'Rain'];
    if (c >= 71 && c <= 77) return ['🌨️', 'Snow'];
    if (c >= 80 && c <= 82) return ['🌧️', 'Showers'];
    if (c === 85 || c === 86) return ['🌨️', 'Snow showers'];
    if (c === 95) return ['⛈️', 'Thunderstorms'];
    if (c === 96 || c === 99) return ['⛈️', 'Storms with hail'];

  function evHTML(e, withWhere) {

      ? shown.map(e => evHTML(e, false)).join('') + (more ? `<li class="more">+${more} more</li>` : '')

  function setTheme(now) {
    const w = data && data.weather;
    let phase = 'day';
    if (w && w.sunrise && w.sunset) {
      const rise = new Date(w.sunrise).getTime(), set = new Date(w.sunset).getTime(), t = now.getTime(), m = 60000;
      if (t < rise - 30 * m || t > set + 45 * m) phase = 'night';

    } else {
      const h = Number(new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).format(now));
      if (h < 6 || h >= 20) phase = 'night';

  function render() {

      const t = w.days[0];
      $('now').innerHTML = `<div class="icon">${icon}</div><div class="temp">${w.now.temp}°</div>
        <div><div class="desc">${esc(label)}</div><div class="sub">High ${t.hi}° &nbsp;Low ${t.lo}°</div>
        <div class="sub">Feels ${w.now.feels}°, wind ${w.now.wind} mph</div></div>`;
      $('forecast').innerHTML = w.days.slice(1, 6).map(d => {
        const [ic] = wx(d.code, true);
        const name = new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
        const rain = d.rain != null && d.rain >= 20 ? `<div class="rain">${d.rain}% rain</div>` : '';
        return `<div class="fc"><div class="ic">${ic}</div><div><div class="dn">${name}</div>

      const today = days[0] && days[0].iso === iso ? days[0] : { events: [] };
      $('today').innerHTML = today.events.length

        : '<li class="empty">Nothing on the calendar today.</li>';

      const rest = days.slice(1, 8);

}

  function launch(html, cls, width, duration, delay, goingLeft) {
    const el = document.createElement('div');
    el.className = 'skater ' + cls + (goingLeft ? ' left' : '');
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    el.style.width = width + 'vw';
    el.innerHTML = html;
    el.addEventListener('animationend', e => { if (e.target === el) el.remove(); });
    $('rink').appendChild(el);
  }

  function sendWalkers() {
    const season = currentSeason();
    const goingLeft = Math.random() < .5;
    if (season === 'christmas') {
      const groups = [['adult'], ['adult', 'chick'], ['adult', 'adult'], ['adult', 'chick', 'adult'], ['adult', 'chick', 'chick']];
      const group = pick(groups);
      const duration = 17 + Math.random() * 7;
      let delay = 0;
      group.forEach(kind => {
        const html = kind === 'chick' ? chickSVG(pick(SCARVES)) : penguinSVG(pick(SCARVES), pick(SCARVES));
        launch(html, 'penguin ' + kind, kind === 'chick' ? 4.6 : 6.8, duration, delay, goingLeft);
        delay += 1.1 + Math.random() * 1.4;
      });
      // Now and then one of them wobbles mid-glide
      if (Math.random() < .35) {
        const all = $('rink').querySelectorAll('.penguin:not(.wobbled)');
        const el = all[all.length - 1 - Math.floor(Math.random() * Math.min(group.length, all.length))];
        if (el) { el.classList.add('wobbled'); el.querySelector('svg').style.animation = `pg-wobble ${duration}s linear ${el.style.animationDelay}`; }
      }
    } else if (season === 'thanksgiving') {
      const count = Math.random() < .7 ? 1 : 2;
      const duration = 24 + Math.random() * 8;
      for (let i = 0; i < count; i++) {
        launch(turkeySVG(), 'turkey', i ? 5.6 : 7.4, duration, i * (2.5 + Math.random() * 2), goingLeft);
      }
      // Now and then the lead turkey stops to show off its tail mid-strut
      if (Math.random() < .35) {
        const all = $('rink').querySelectorAll('.turkey');
        const lead = all[all.length - count];
        if (lead) { const tail = lead.querySelector('.tk-tail'); tail.style.animation = `tk-display ${duration}s ease-in-out ${lead.style.animationDelay}`; }
      }
    }
  }

  let particleSeason = '';
  function updateParticles() {
    const season = currentSeason();
    if (season === particleSeason) return;
    document.querySelectorAll('.particle').forEach(p => p.remove());
    particleSeason = season;
    if (!season || !SEASONS[season].falling) return;
    const isSnow = season === 'christmas';
    const n = isSnow ? 26 : 13;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      const dur = isSnow ? 16 + Math.random() * 14 : 18 + Math.random() * 12;
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (-Math.random() * dur) + 's';
      if (isSnow) {
        const size = 3 + Math.random() * 4;
        p.className = 'particle flake';
        p.style.width = p.style.height = size + 'px';
        p.style.opacity = (.35 + Math.random() * .45).toFixed(2);
      } else {
        p.className = 'particle leaf';
        p.style.width = (14 + Math.random() * 10) + 'px';
        p.style.opacity = (.7 + Math.random() * .25).toFixed(2);
        p.innerHTML = `<svg viewBox="0 0 20 20" style="animation-duration:${(4 + Math.random() * 5).toFixed(1)}s"><path fill="${pick(LEAVES)}" d="M10 1 C15.5 5 17.5 11 10 18 C2.5 11 4.5 5 10 1 Z"/><path d="M10 4 L10 20" stroke="rgba(0,0,0,.25)" stroke-width="1"/></svg>`;
      }
      $('rink').appendChild(p);
    }
  }

  function nextWalkers() {
    const wait = previewSeason ? 20000 : (2 + Math.random() * 5) * 60000; // every 2 to 7 minutes
    setTimeout(() => { updateParticles(); sendWalkers(); nextWalkers(); }, wait);
  }
  updateParticles();
  setTimeout(sendWalkers, 6000);
  nextWalkers();

  tick();
  load();
  setInterval(tick, 15000);
  setInterval(load, REFRESH_MINUTES * 60000);
</script>
