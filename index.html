<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #C6DAE6;
    --sky-bottom: #EEF3F5;
    --ink: #142230;
    --muted: #536676;
    --faint: rgba(20, 34, 48, .13);
    --alert: #B3261E;
    --sans: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
  }
  :root[data-phase="dusk"] { --sky-top: #C9C3D9; --sky-bottom: #EFECF2; }
  :root[data-phase="night"] { --sky-top: #0D1727; --sky-bottom: #1A2638; --ink: #E2E8EF; --muted: #8B9AAD; --faint: rgba(226, 232, 239, .14); }

  html, body { height: 100%; margin: 0; }
  html { background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 75%) fixed; background-color: var(--sky-top); }
  body {
    color: var(--ink);
    font-family: var(--sans);
    font-size: clamp(13px, 1.55vw, 22px);
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .wrap {
    box-sizing: border-box;
    height: 100%;
    padding: max(2.4vw, env(safe-area-inset-top)) 3.2vw max(2vw, env(safe-area-inset-bottom));
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 2.4vw;
  }

  /* Top: clock and current weather */
  .top { display: flex; flex-direction: column; gap: 1em; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 2em; }
  .clock { font-size: 5.4em; font-weight: 300; letter-spacing: -.035em; line-height: .88; font-variant-numeric: tabular-nums; }
  .clock small { font-size: .3em; font-weight: 500; letter-spacing: 0; margin-left: .25em; color: var(--muted); }
  .date { font-size: 1.45em; font-weight: 500; margin-top: .35em; }
  .now { display: flex; align-items: center; gap: .55em; }
  .now .icon { font-size: 3.4em; line-height: 1; }
  .now .temp { font-size: 4.6em; font-weight: 300; line-height: .88; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .now .desc { font-size: 1.15em; font-weight: 600; }
  .now .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
  .alert { display: none; background: var(--alert); color: #fff; padding: .55em .9em; border-radius: .45em; font-weight: 600; font-size: 1.1em; }
  .alert.show { display: block; }

  /* Middle: today + coming up */
  main { display: grid; grid-template-columns: 1.12fr 1fr; gap: 4vw; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; }
  h2 { font-size: 1.55em; font-weight: 650; letter-spacing: -.01em; margin: 0 0 .45em; }
  ul { list-style: none; margin: 0; padding: 0; }
  .ev { display: grid; grid-template-columns: 5.4em 1fr; gap: .7em; align-items: baseline; padding: .32em 0; }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .88em; white-space: nowrap; }
  .ev .name { position: relative; padding-left: .7em; }
  .ev .name::before { content: ""; position: absolute; left: 0; top: .12em; bottom: .12em; width: .24em; border-radius: .2em; background: var(--bar); }
  .ev .where { display: block; color: var(--muted); font-size: .7em; margin-top: .1em; }
  .today-list { flex: 1 1 0; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); }
  .today-list .ev { font-size: 1.4em; padding: .4em 0; }
  .empty { color: var(--muted); padding: .3em 0; }
  .today-list .empty { font-size: 1.25em; }

  .faith { display: flex; align-items: center; gap: 1.4em; border-top: 1px solid var(--faint); padding-top: .9em; margin-top: .6em; }
  .verse { flex: 1; min-width: 0; }

  /* Advent wreath */
  .advent { display: none; flex: 0 0 auto; width: 7.6em; text-align: center; --wr-1: #2F5A3A; --wr-2: #3E7049; --wr-3: #244A30; --purple: #5E3A8C; --rose: #C9659A; }
  .advent.show { display: block; }
  :root[data-phase="night"] .advent { --wr-1: #4E8A5C; --wr-2: #66A374; --wr-3: #3D7350; --purple: #9572C6; --rose: #E08AB6; }
  .advent svg { display: block; width: 100%; height: auto; overflow: visible; }
  .advent .cap { color: var(--muted); font-size: .74em; line-height: 1.25; margin-top: .15em; }
  .advent .cap b { display: block; color: var(--ink); font-size: 1.15em; font-weight: 650; }
  .advent .num { font-family: var(--sans); font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .advent .unit { font-family: var(--sans); font-weight: 500; fill: var(--muted); }
  .advent .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.9s ease-in-out infinite alternate; }
  .advent .glow { animation: glow 1.9s ease-in-out infinite alternate; }
  @keyframes flicker { 0% { transform: scale(1, 1) skewX(0deg); } 40% { transform: scale(.93, 1.07) skewX(2deg); } 100% { transform: scale(1.04, .95) skewX(-2deg); } }
  @keyframes glow { from { opacity: .22; } to { opacity: .38; } }
  .verse p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.3em; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .verse cite { display: block; font-style: normal; font-weight: 600; color: var(--muted); margin-top: .4em; font-size: .9em; }

  .days { flex: 1 1 0; min-height: 0; overflow: hidden; }
  .day { display: grid; grid-template-columns: 4.2em 1fr; gap: .7em; padding: .38em 0; border-top: 1px solid var(--faint); }
  .day:first-child { border-top: 0; padding-top: 0; }
  .day .lab { line-height: 1.25; white-space: nowrap; }
  .day .lab span { display: inline; color: var(--muted); font-size: .85em; margin-right: .3em; }
  .day .lab b { font-size: 1.2em; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .day .ev { grid-template-columns: 4.8em 1fr; padding: .12em 0; }
  .day .empty, .day .more { color: var(--muted); font-size: .9em; padding: .12em 0; }

  /* Bottom: forecast + legend */
  footer { display: grid; grid-template-columns: 1fr auto; gap: 3vw; align-items: center; border-top: 1px solid var(--faint); padding-top: 1em; }
  .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1em; }
  .fc { display: flex; align-items: center; gap: .5em; }
  .fc .ic { font-size: 1.9em; line-height: 1; }
  .fc .dn { font-weight: 600; }
  .fc .hl { font-variant-numeric: tabular-nums; }
  .fc .lo, .fc .rain { color: var(--muted); }
  .fc .rain { font-size: .8em; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .35em; }
  .legend { display: flex; gap: 1em; flex-wrap: wrap; justify-content: flex-end; color: var(--muted); font-size: .85em; }
  .legend button { font: inherit; color: inherit; background: none; border: 0; padding: .45em .55em; margin: -.45em -.3em; border-radius: .4em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .legend i { display: inline-block; width: .62em; height: .62em; border-radius: 50%; background: var(--c); margin-right: .35em; }
  .legend .off { opacity: .45; text-decoration: line-through; }
  .legend .off i { background: transparent; box-shadow: inset 0 0 0 .12em var(--c); }
  .status { color: var(--muted); font-size: .75em; }
  .status.warn { color: var(--alert); font-weight: 600; }
  :root[data-phase="night"] .status.warn { color: #F2A29C; }


  /* Seasonal themes: Thanksgiving turkeys and leaves, Christmas skaters and snow */
  #rink { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .skater { position: absolute; left: 0; bottom: .2vw; width: 7.5vw; color: var(--ink); opacity: .85; animation: glide linear forwards; will-change: transform; }
  .skater.left { animation-name: glide-left; }
  .skater svg { display: block; width: 100%; height: auto; overflow: visible; }
  .skater .bob { animation: bob 1.7s ease-in-out infinite; }
  .skater .leg { transform-box: view-box; transform-origin: 30px 47px; animation: stride 1.7s ease-in-out infinite; }
  .skater .leg.b { animation-delay: -.85s; }
  .skater .scarf { transform-box: view-box; transform-origin: 37px 25px; animation: flutter .45s ease-in-out infinite alternate; }
  @keyframes glide { from { transform: translateX(-12vw); } to { transform: translateX(112vw); } }
  @keyframes glide-left { from { transform: translateX(112vw) scaleX(-1); } to { transform: translateX(-12vw) scaleX(-1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  @keyframes stride { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(20deg); } }
  @keyframes flutter { from { transform: rotate(-3deg); } to { transform: rotate(5deg) scaleY(.85); } }
  .flake { position: absolute; top: -2vw; border-radius: 50%; background: rgba(255, 255, 255, .92); box-shadow: 0 0 2px rgba(20, 34, 48, .25); animation: fall linear infinite; }
  @keyframes fall { 0% { transform: translate(0, 0); } 50% { transform: translate(1.5vw, 52vh); } 100% { transform: translate(-1vw, 106vh); } }
  .turkey { opacity: 1; --tk-body: #5A3A24; --tk-wing: #7A5236; --tk-head: #8C6B55; }
  :root[data-phase="night"] .turkey { --tk-body: #B07A50; --tk-wing: #D2A273; --tk-head: #D9BBA2; }
  .turkey .tk-body { fill: var(--tk-body); }
  .turkey .tk-wing { fill: var(--tk-wing); }
  .turkey .tk-neck { stroke: var(--tk-body); }
  .turkey .tk-head { fill: var(--tk-head); }
  .turkey .tleg { transform-box: view-box; transform-origin: 42px 60px; animation: strut .9s ease-in-out infinite; }
  .turkey .tleg.b { animation-delay: -.45s; }
  .turkey .head { transform-box: view-box; transform-origin: 51px 47px; animation: peck .9s ease-in-out infinite; }
  @keyframes strut { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  @keyframes peck { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }
  .leaf { position: absolute; top: -3vw; animation: leaf-fall linear infinite; }
  .leaf svg { display: block; width: 100%; height: auto; animation: spin linear infinite; }
  @keyframes leaf-fall { 0% { transform: translate(0, 0); } 33% { transform: translate(3vw, 36vh); } 66% { transform: translate(-2.5vw, 72vh); } 100% { transform: translate(1vw, 108vh); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #rink { display: none; } }

  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .forecast { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div id="rink"></div>
<div class="wrap">
  <div class="top">
    <header>
      <div>
        <div class="clock" id="clock"></div>
        <div class="date" id="date"></div>
      </div>
      <div class="now" id="now"></div>
    </header>
    <div class="alert" id="alert"></div>
  </div>

  <main>
    <section>
      <h2>Today</h2>
      <ul class="today-list" id="today"></ul>
      <div class="faith">
        <div class="advent" id="advent"></div>
        <div class="verse" id="verse"></div>
      </div>
    </section>
    <section>
      <h2>Coming up</h2>
      <div class="days" id="days"></div>
    </section>
  </main>

  <footer>
    <div class="forecast" id="forecast"></div>
    <div class="side">
      <div class="legend" id="legend"></div>
      <div class="status" id="status"></div>
    </div>
  </footer>
</div>

<script>
  // ---------- SETTINGS ----------
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbIfUR039krPjlgW-TGfQ5ne9a4GGb1ZOm4t7XvpUcs9wkgOE-rtM5i4tQcW5tXRgNkQ/exec'; // ends in /exec
  const TZ = 'America/Chicago';
  const REFRESH_MINUTES = 10;
  // ------------------------------

  const $ = id => document.getElementById(id);
  let data = null, lastOk = 0, lastError = '', shownDay = '';

  function getKey() {
    const fromLink = new URLSearchParams(location.hash.slice(1)).get('k');
    if (fromLink) { try { localStorage.setItem('portalKey', fromLink); } catch (e) {} return fromLink; }
    try { const saved = localStorage.getItem('portalKey'); if (saved) return saved; } catch (e) {}
    const typed = prompt('Enter the family portal key');
    if (typed) { try { localStorage.setItem('portalKey', typed); } catch (e) {} }
    return typed || '';
  }
  const KEY = getKey();

  // People hidden on this iPad (tap a name in the legend to hide or show)
  let hidden = [];
  try { hidden = JSON.parse(localStorage.getItem('portalHidden') || '[]'); } catch (e) {}
  function toggleHidden(name) {
    hidden = hidden.includes(name) ? hidden.filter(n => n !== name) : hidden.concat(name);
    try { localStorage.setItem('portalHidden', JSON.stringify(hidden)); } catch (e) {}
    render();
  }
  // Drops events that belong only to hidden people; shared events keep the visible people's colors
  function visible(events) {
    return events.map(e => {
      const keep = e.who.map((w, i) => i).filter(i => !hidden.includes(e.who[i]));
      return keep.length ? Object.assign({}, e, { who: keep.map(i => e.who[i]), colors: keep.map(i => e.colors[i]) }) : null;
    }).filter(Boolean);
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const todayIso = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const shortTime = t => String(t).replace(':00 ', ' ');

  function wx(code, isDay) {
    const c = Number(code);
    if (c === 0) return [isDay === false ? '🌙' : '☀️', 'Clear'];
    if (c === 1) return [isDay === false ? '🌙' : '🌤️', 'Mostly clear'];
    if (c === 2) return ['⛅', 'Partly cloudy'];
    if (c === 3) return ['☁️', 'Cloudy'];
    if (c === 45 || c === 48) return ['🌫️', 'Fog'];
    if (c >= 51 && c <= 55) return ['🌦️', 'Drizzle'];
    if (c === 56 || c === 57 || c === 66 || c === 67) return ['🧊', 'Freezing rain'];
    if (c >= 61 && c <= 65) return ['🌧️', 'Rain'];
    if (c >= 71 && c <= 77) return ['🌨️', 'Snow'];
    if (c >= 80 && c <= 82) return ['🌧️', 'Showers'];
    if (c === 85 || c === 86) return ['🌨️', 'Snow showers'];
    if (c === 95) return ['⛈️', 'Thunderstorms'];
    if (c === 96 || c === 99) return ['⛈️', 'Storms with hail'];
    return ['🌡️', ''];
  }

  function evHTML(e, withWhere) {
    const n = e.colors.length;
    const bar = n > 1
      ? 'linear-gradient(' + e.colors.map((c, i) => `${c} ${i * 100 / n}% ${(i + 1) * 100 / n}%`).join(',') + ')'
      : e.colors[0];
    const where = withWhere && e.where ? `<span class="where">${esc(e.where.split(',')[0])}</span>` : '';
    return `<li class="ev"><span class="t">${esc(shortTime(e.time))}</span><span class="name" style="--bar:${bar}">${esc(e.title)}${where}</span></li>`;
  }

  function dayHTML(d, max) {
    const evs = d.events;
    const shown = evs.length <= max + 1 ? evs : evs.slice(0, max);
    const more = evs.length - shown.length;
    const items = evs.length
      ? shown.map(e => evHTML(e, false)).join('') + (more ? `<li class="more">+${more} more</li>` : '')
      : '<li class="empty">Nothing scheduled</li>';
    return `<div class="day"><div class="lab"><span>${esc(d.short)}</span><b>${esc(d.dayNum)}</b></div><ul>${items}</ul></div>`;
  }

  function tick() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(now);
    const g = t => (parts.find(p => p.type === t) || {}).value || '';
    $('clock').innerHTML = `${g('hour')}:${g('minute')}<small>${g('dayPeriod')}</small>`;
    $('date').textContent = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric' }).format(now);
    setTheme(now);
    renderAdvent();
    if (shownDay && shownDay !== todayIso()) load(); // new day: refresh right away
    renderStatus();
  }

  function setTheme(now) {
    const w = data && data.weather;
    let phase = 'day';
    if (w && w.sunrise && w.sunset) {
      const rise = new Date(w.sunrise).getTime(), set = new Date(w.sunset).getTime(), t = now.getTime(), m = 60000;
      if (t < rise - 30 * m || t > set + 45 * m) phase = 'night';
      else if (t < rise + 30 * m || t > set - 30 * m) phase = 'dusk';
    } else {
      const h = Number(new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).format(now));
      if (h < 6 || h >= 20) phase = 'night';
    }
    document.documentElement.dataset.phase = phase;
  }

  function render() {
    if (!data) return;
    const w = data.weather;

    if (w) {
      const [icon, label] = wx(w.now.code, w.now.isDay);
      const t = w.days[0];
      $('now').innerHTML = `<div class="icon">${icon}</div><div class="temp">${w.now.temp}°</div>
        <div><div class="desc">${esc(label)}</div><div class="sub">High ${t.hi}° &nbsp;Low ${t.lo}°</div>
        <div class="sub">Feels ${w.now.feels}°, wind ${w.now.wind} mph</div></div>`;
      $('forecast').innerHTML = w.days.slice(1, 6).map(d => {
        const [ic] = wx(d.code, true);
        const name = new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
        const rain = d.rain != null && d.rain >= 20 ? `<div class="rain">${d.rain}% rain</div>` : '';
        return `<div class="fc"><div class="ic">${ic}</div><div><div class="dn">${name}</div>
          <div class="hl">${d.hi}° <span class="lo">${d.lo}°</span></div>${rain}</div></div>`;
      }).join('');
    }

    const alerts = data.alerts || [];
    $('alert').className = 'alert' + (alerts.length ? ' show' : '');
    $('alert').textContent = alerts.map(a => {
      const until = a.ends ? ' until ' + new Date(a.ends).toLocaleString('en-US', { timeZone: TZ, weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';
      return a.event + until;
    }).join('   |   ');

    if (data.calendar) {
      const iso = todayIso();
      let days = data.calendar.days;
      const i = days.findIndex(d => d.iso === iso);
      if (i > 0) days = days.slice(i);
      shownDay = iso;
      days = days.map(d => Object.assign({}, d, { events: visible(d.events) }));
      const today = days[0] && days[0].iso === iso ? days[0] : { events: [] };
      $('today').innerHTML = today.events.length
        ? today.events.map(e => evHTML(e, true)).join('')
        : '<li class="empty">Nothing on the calendar today.</li>';

      const rest = days.slice(1, 8);
      const box = $('days');
      for (let max = 3; max >= 1; max--) {
        box.innerHTML = rest.map(d => dayHTML(d, max)).join('');
        if (box.scrollHeight <= box.clientHeight + 2) break;
      }
    } else if (data.calendarError) {
      $('today').innerHTML = '<li class="empty">Calendars didn’t load. Run testSetup in Apps Script to see why.</li>';
    }

    const v = data.verse;
    $('verse').innerHTML = v ? `<p>${esc(v.text)}</p><cite>${esc(v.ref)} (${esc(v.version)})</cite>` : '';

    $('legend').innerHTML = (data.people || []).map(p =>
      `<button type="button" class="${hidden.includes(p.name) ? 'off' : ''}" data-name="${esc(p.name)}"><i style="--c:${p.color}"></i>${esc(p.name)}</button>`).join('');
    setTheme(new Date());
  }

  function renderStatus() {
    const el = $('status');
    const problems = (data && data.calendar && data.calendar.problems) || [];
    const stale = lastOk && Date.now() - lastOk > 30 * 60000;
    if (!lastOk && lastError) { el.className = 'status warn'; el.textContent = 'Can’t reach the portal service: ' + lastError; return; }
    if (stale) {
      el.className = 'status warn';
      el.textContent = 'Last updated ' + new Date(lastOk).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
      return;
    }
    el.className = problems.length ? 'status warn' : 'status';
    el.textContent = problems.join('. ');
  }

  async function load() {
    try {
      const res = await fetch(API_URL + '?key=' + encodeURIComponent(KEY) + '&t=' + Date.now());
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      data = json; lastOk = Date.now(); lastError = '';
      render();
    } catch (err) {
      lastError = err.message || String(err);
    }
    renderStatus();
  }

  $('legend').addEventListener('click', e => {
    const b = e.target.closest('button[data-name]');
    if (b) toggleHidden(b.dataset.name);
  });


  // ---------- Advent wreath ----------
  // One candle lights each Sunday of Advent; the middle counts down to Christmas.
  // Shows from the first Sunday of Advent through ADVENT_END. Preview another day with &date=2026-12-14
  const ADVENT_END = '01-01';
  const ADVENT_THEMES = ['Hope', 'Peace', 'Joy', 'Love'];   // change the order here if your tradition differs
  const CANDLES = ['purple', 'purple', 'rose', 'purple'];   // third candle is the rose (joy) candle
  let adventShown = '';

  function adventToday() {
    const d = new URLSearchParams(location.hash.slice(1)).get('date');
    return /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : todayIso();
  }
  const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
  function adventInfo(iso) {
    const [y, m] = iso.split('-').map(Number);
    const xYear = m === 1 ? y - 1 : y;                          // in January, look back at last Christmas
    const xmas = Date.UTC(xYear, 11, 25) / 86400000;
    const xmasDow = new Date(Date.UTC(xYear, 11, 25)).getUTCDay();
    const fourthSunday = xmas - (xmasDow === 0 ? 7 : xmasDow);
    const firstSunday = fourthSunday - 21;
    const today = dayNum(iso);
    const [ey, em, ed] = [xYear + 1, ...ADVENT_END.split('-').map(Number)];
    const end = em === 1 ? Date.UTC(ey, em - 1, ed) / 86400000 : Date.UTC(xYear, em - 1, ed) / 86400000;
    if (today < firstSunday || today > end) return null;
    return {
      week: Math.min(4, Math.floor((today - firstSunday) / 7) + 1),
      daysLeft: xmas - today
    };
  }

  function wreathSVG(info) {
    const cx = 60, cy = 62, R = 38;
    let leaves = '';
    for (let i = 0; i < 36; i++) {
      const a = i * 10 + (i % 3) * 3;
      const r = R + ((i % 4) - 1.5) * 2.2;
      const x = cx + r * Math.cos(a * Math.PI / 180), y = cy + r * Math.sin(a * Math.PI / 180);
      const tilt = a + 90 + ((i % 5) - 2) * 14;
      leaves += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="9.5" ry="4" fill="var(--wr-${(i % 3) + 1})" transform="rotate(${tilt} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
    let berries = '';
    for (let i = 0; i < 9; i++) {
      const a = i * 40 + 20, r = i % 2 ? R + 6 : R - 6;
      berries += `<circle cx="${(cx + r * Math.cos(a * Math.PI / 180)).toFixed(1)}" cy="${(cy + r * Math.sin(a * Math.PI / 180)).toFixed(1)}" r="2.3" fill="#C8382E"/>`;
    }
    const flame = (x, top, delay) => `
      <circle class="glow" cx="${x}" cy="${top - 5}" r="8" fill="#F6B73C" style="animation-delay:${delay}s"/>
      <path class="flame" style="animation-delay:${delay}s" d="M${x} ${top - 12} C${x + 4} ${top - 6} ${x + 4} ${top - 1} ${x} ${top} C${x - 4} ${top - 1} ${x - 4} ${top - 6} ${x} ${top - 12} Z" fill="#F6B73C"/>
      <path d="M${x} ${top - 7} C${x + 2} ${top - 4} ${x + 2} ${top - 1.5} ${x} ${top - 1} C${x - 2} ${top - 1.5} ${x - 2} ${top - 4} ${x} ${top - 7} Z" fill="#FFF1C2"/>`;
    const spots = [225, 315, 45, 135];
    let candles = '';
    spots.forEach((deg, i) => {
      const x = +(cx + R * Math.cos(deg * Math.PI / 180)).toFixed(1);
      const base = +(cy + R * Math.sin(deg * Math.PI / 180)).toFixed(1) + 3;
      const top = base - 24;
      const lit = info.daysLeft <= 0 || i < info.week;
      candles += `<rect x="${x - 4.5}" y="${top}" width="9" height="24" rx="1.6" fill="var(--${CANDLES[i]})"/>
        <path d="M${x} ${top} L${x} ${top - 2.5}" stroke="var(--ink)" stroke-width="1" opacity=".6"/>
        ${lit ? flame(x, top - 1.5, -i * .45) : ''}`;
    });
    let middle;
    if (info.daysLeft > 0) {
      middle = `<text class="num" x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="${info.daysLeft > 9 ? 23 : 26}">${info.daysLeft}</text>
        <text class="unit" x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="7.5">${info.daysLeft === 1 ? 'day' : 'days'}</text>`;
    } else {
      middle = `<rect x="${cx - 5}" y="${cy - 8}" width="10" height="26" rx="1.8" fill="#F4EFE6" stroke="rgba(0,0,0,.15)" stroke-width=".6"/>
        <path d="M${cx} ${cy - 8} L${cx} ${cy - 10.5}" stroke="var(--ink)" stroke-width="1" opacity=".6"/>${flame(cx, cy - 10, -.9)}`;
    }
    return `<svg viewBox="0 0 120 120" aria-hidden="true">${leaves}${berries}${candles}${middle}</svg>`;
  }

  function renderAdvent() {
    const iso = adventToday();
    if (iso === adventShown) return;
    adventShown = iso;
    const box = $('advent');
    const info = adventInfo(iso);
    if (!info) { box.className = 'advent'; box.innerHTML = ''; return; }
    let cap;
    if (info.daysLeft > 1) cap = `<b>${ADVENT_THEMES[info.week - 1]}</b>Advent week ${info.week}`;
    else if (info.daysLeft === 1) cap = '<b>Christmas Eve</b>';
    else if (info.daysLeft === 0) cap = '<b>Merry Christmas!</b>';
    else cap = '<b>Christmas</b>season';
    box.className = 'advent show';
    box.innerHTML = wreathSVG(info) + `<div class="cap">${cap}</div>`;
  }

  // ---------- Seasonal themes ----------
  // Dates are month-day, inclusive. To preview, add &season=thanksgiving or &season=christmas to the link.
  const SEASONS = {
    thanksgiving: { start: '11-01', end: '11-30', falling: true },  // falling leaves + strutting turkeys
    christmas:    { start: '12-01', end: '01-01', falling: true }   // snow + skaters
  };
  const SCARVES = ['#C8382E', '#2E7D4F', '#D4A12A', '#2F6FB0', '#B8487A'];
  const LEAVES = ['#B8452A', '#D98B2B', '#9C3423', '#C9A03A', '#A8612E'];
  const FEATHERS = ['#8E3A22', '#C9772A', '#6E4528', '#D49A3A', '#A6502A'];

  const previewSeason = (() => {
    const h = new URLSearchParams(location.hash.slice(1));
    return h.get('season') || (h.get('xmas') === '1' ? 'christmas' : '');
  })();
  const inRange = (md, a, b) => a <= b ? (md >= a && md <= b) : (md >= a || md <= b);
  function currentSeason() {
    if (previewSeason && SEASONS[previewSeason]) return previewSeason;
    const md = todayIso().slice(5);
    return Object.keys(SEASONS).find(k => inRange(md, SEASONS[k].start, SEASONS[k].end)) || '';
  }
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function skaterSVG(scarf, hat) {
    return `<svg viewBox="0 0 60 84" aria-hidden="true"><g class="bob"><g transform="rotate(9 30 72)">
      <path class="scarf" fill="${scarf}" d="M38 23 C30 22 20 19 8 23 L9 28 C20 25 29 26 37 28 Z"/>
      <g fill="currentColor">
        <circle cx="36" cy="17" r="7"/>
        <path d="M30 24 L42 24 L36 48 L24 48 Z"/>
      </g>
      <path fill="${hat}" d="M28.6 15.5 Q36 2 43.4 15.5 Z"/><circle fill="${hat}" cx="36" cy="5.5" r="2.8"/>
      <path fill="${scarf}" d="M31 23 L42 23 L41 27 L32 27 Z"/>
      <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none">
        <path d="M33 29 L21 37"/><path d="M40 29 L51 34"/>
      </g>
      <g class="leg a" stroke="currentColor" stroke-linecap="round" fill="none">
        <path stroke-width="5.5" d="M30 47 L26 70"/><path stroke-width="2" d="M20 73.5 L33 73.5"/>
      </g>
      <g class="leg b" stroke="currentColor" stroke-linecap="round" fill="none">
        <path stroke-width="5.5" d="M31 47 L35 70"/><path stroke-width="2" d="M29 73.5 L42 73.5"/>
      </g>
    </g></g></svg>`;
  }

  function turkeySVG() {
    const fan = [-62, -31, 0, 31, 62].map((a, i) =>
      `<ellipse cx="30" cy="27" rx="7.5" ry="21" fill="${FEATHERS[i]}" transform="rotate(${a} 30 50)"/>`).join('');
    return `<svg viewBox="0 0 80 80" aria-hidden="true"><g class="bob">
      ${fan}
      <g class="tleg a" stroke="#D4A12A" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M40 60 L38 76 M38 76 L44 77"/></g>
      <g class="tleg b" stroke="#D4A12A" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M44 60 L45 76 M45 76 L51 77"/></g>
      <ellipse class="tk-body" cx="41" cy="50" rx="18" ry="14"/>
      <path class="tk-wing" d="M30 47 C36 41 47 43 50 52 C43 55 35 54 30 47 Z"/>
      <g class="head">
        <path class="tk-neck" d="M51 46 C54 40 55 35 56 30" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <circle class="tk-head" cx="57" cy="27" r="5.2"/>
        <path d="M62 26 L68 28 L62 30 Z" fill="#D4A12A"/>
        <path d="M60.5 29.5 C63 31 63 35 60.5 37 C59 35 59 32 60.5 29.5 Z" fill="#C8382E"/>
        <circle cx="58.5" cy="25.6" r="1.1" fill="#142230"/>
      </g>
    </g></svg>`;
  }

  function launch(html, cls, width, duration, delay, goingLeft) {
    const el = document.createElement('div');
    el.className = 'skater ' + cls + (goingLeft ? ' left' : '');
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    el.style.width = width + 'vw';
    el.innerHTML = html;
    el.addEventListener('animationend', e => { if (e.target === el) el.remove(); });
    $('rink').appendChild(el);
  }

  function sendWalkers() {
    const season = currentSeason();
    const goingLeft = Math.random() < .5;
    if (season === 'christmas') {
      const count = Math.random() < .45 ? 1 : (Math.random() < .7 ? 2 : 3);
      const duration = 15 + Math.random() * 7;
      let delay = 0;
      for (let i = 0; i < count; i++) {
        launch(skaterSVG(pick(SCARVES), pick(SCARVES)), 'ice', 6.2 + Math.random() * 2.2, duration, delay, goingLeft);
        delay += 1 + Math.random() * 1.6;
      }
    } else if (season === 'thanksgiving') {
      const count = Math.random() < .7 ? 1 : 2;
      const duration = 24 + Math.random() * 8;
      for (let i = 0; i < count; i++) {
        launch(turkeySVG(), 'turkey', i ? 5 : 6.8, duration, i * (2.5 + Math.random() * 2), goingLeft);
      }
    }
  }

  let particleSeason = '';
  function updateParticles() {
    const season = currentSeason();
    if (season === particleSeason) return;
    document.querySelectorAll('.particle').forEach(p => p.remove());
    particleSeason = season;
    if (!season || !SEASONS[season].falling) return;
    const isSnow = season === 'christmas';
    const n = isSnow ? 26 : 13;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      const dur = isSnow ? 16 + Math.random() * 14 : 18 + Math.random() * 12;
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (-Math.random() * dur) + 's';
      if (isSnow) {
        const size = 3 + Math.random() * 4;
        p.className = 'particle flake';
        p.style.width = p.style.height = size + 'px';
        p.style.opacity = (.35 + Math.random() * .45).toFixed(2);
      } else {
        p.className = 'particle leaf';
        p.style.width = (14 + Math.random() * 10) + 'px';
        p.style.opacity = (.7 + Math.random() * .25).toFixed(2);
        p.innerHTML = `<svg viewBox="0 0 20 20" style="animation-duration:${(4 + Math.random() * 5).toFixed(1)}s"><path fill="${pick(LEAVES)}" d="M10 1 C15.5 5 17.5 11 10 18 C2.5 11 4.5 5 10 1 Z"/><path d="M10 4 L10 20" stroke="rgba(0,0,0,.25)" stroke-width="1"/></svg>`;
      }
      $('rink').appendChild(p);
    }
  }

  function nextWalkers() {
    const wait = previewSeason ? 20000 : (2 + Math.random() * 5) * 60000; // every 2 to 7 minutes
    setTimeout(() => { updateParticles(); sendWalkers(); nextWalkers(); }, wait);
  }
  updateParticles();
  setTimeout(sendWalkers, 6000);
  nextWalkers();

  tick();
  load();
  setInterval(tick, 15000);
  setInterval(load, REFRESH_MINUTES * 60000);
</script>
</body>
</html>
